<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAIA32 工具提示词对照</title>
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#172033}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.7rem;text-align:left}th{background:#f2f5fa}small{color:#555}a{color:#1755b3}</style>
<h1>GAIA32 · 4B 基座工具提示词对照</h1><p>同一批 32 题、BM25 和本地 4B 记忆；网页搜索独立进行。点击实验组查看轨迹。</p>
<p id="status">等待数据……</p><table><thead><tr><th>实验组</th><th>已评分/通过</th><th>工具调用 JSON 合法</th><th>已执行/尝试</th><th>返回无明确工具错误/执行</th><th>搜索 HTTP 2xx</th><th>Reader HTTP 2xx</th></tr></thead><tbody id="rows"></tbody></table>
<p id="paired"></p><small>调用尝试以每次模型输出中最后一个可见 tool_call 计数；JSON 合法仅检查对象、名称和参数类型。返回无明确错误是工具外层结果未以已识别错误开头，不代表证据正确或网页有用。HTTP 按请求计数，含重试。进行中的未结束调用不计入。网页独立获取，结果不能归因于提示词单一因素。</small>
<script>
function ratio(n,d){return `${n||0}/${d||0}`+(d?` (${(100*(n||0)/d).toFixed(1)}%)`:'')}
async function refresh(){try{const r=await fetch('/api/v1/reports/gaia-toolprompt-comparison.json',{cache:'no-store'});if(!r.ok)return;const x=await r.json(),body=document.getElementById('rows');body.replaceChildren();document.getElementById('status').textContent='更新时间：'+new Date(x.updated*1000).toLocaleString();for(const [key,g] of Object.entries(x.groups)){const m=g.metrics, row=document.createElement('tr'), name=document.createElement('td'),a=document.createElement('a');a.href='trace-viewer-zh/?dataset='+encodeURIComponent(g.run);a.textContent=key==='original'?'原提示词':'优化提示词';name.appendChild(a);row.appendChild(name);for(const v of [ratio(m.correct,m.scored),ratio(m.json_valid,m.attempts),ratio(m.dispatched,m.attempts),ratio(m.returned_without_explicit_error,m.dispatched),ratio(m.search_query_http_2xx,m.search_query_http_total),ratio(m.reader_http_2xx,m.reader_http_total)]){let td=document.createElement('td');td.textContent=v;row.appendChild(td)}body.appendChild(row)}const p=x.paired;document.getElementById('paired').textContent=`配对已评分 ${p.count} 题：仅优化组正确 ${p.optimized_only}；仅原组正确 ${p.original_only}；均正确 ${p.both_correct}；均错误 ${p.both_wrong}。`}catch(e){document.getElementById('status').textContent='数据暂不可用'}}refresh();setInterval(refresh,30000);
</script></html>
